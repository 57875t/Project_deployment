name: QR Desk v0.8 K-line CI

on:
  pull_request:
    paths:
      - ".github/workflows/qrdesk-v08-kline-ci.yml"
      - "qrdesk_gateway/**"
      - "tests/**"
      - "requirements.txt"
      - "docs/V0.8_KLINE_CORE_AUDIT.md"
  push:
    branches:
      - "agent/qrdesk-v0.8-kline-core"
    paths:
      - ".github/workflows/qrdesk-v08-kline-ci.yml"
      - "qrdesk_gateway/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip --quiet
      - run: python -m pip install --quiet -r requirements.txt pytest
      - run: python -m compileall -q qrdesk_gateway
      - name: Run deterministic tests
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
